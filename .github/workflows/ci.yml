name: NetMon checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: netmon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: netmon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: netmon_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U netmon -d netmon_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://netmon:test-only-password@127.0.0.1:5432/netmon_test
      E2E_DATABASE_URL: postgresql://netmon:test-only-password@127.0.0.1:5432/netmon_test_e2e
      NETMON_TEST_RESET: "YES"
      POSTGRES_PASSWORD: ci-only-compose-password
      API_TOKEN: ci-only-operator-token-at-least-24-characters
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run lint && npm run check:config && npm test && npm run test:integration && npm run build
      - run: npm audit --audit-level=moderate
      - name: Secret scan (entire checked-out source, no external recipients)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo --redact --exit-code 1
      - name: Prepare isolated browser database
        run: node --input-type=module -e "import pg from 'pg';const c=new pg.Client({connectionString:process.env.TEST_DATABASE_URL});await c.connect();await c.query('CREATE DATABASE netmon_test_e2e');await c.end();"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build and smoke complete Compose stack
        env:
          POSTGRES_PASSWORD: ci-only-compose-password
          API_TOKEN: ci-only-operator-token-at-least-24-characters
        run: |
          docker compose --profile demo up --build -d --wait --wait-timeout 120
          docker compose run --rm web node server/src/seed.js
          node -e "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1))"
      - name: Container failure diagnostics
        if: failure()
        run: docker compose logs --no-color || true
      - name: Stop containers (keep volumes)
        if: always()
        run: docker compose down || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            test-results/
            playwright-report/
